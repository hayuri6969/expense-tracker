<!DOCTYPE html>
<html>

<head>
    <title>Background Image</title>

    <style>
        body {
            background-image: url('rogergalelook.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            height: 100vh;
            margin: 10;

            display: flex;
            justify-content: left;
            align-items: left;
        }

        .rectangle {
            width: 2000px;
            height: 200px;
            background-color: white;
            text-align: left;
            border-radius: 50px;
            padding: 0px;
            padding-left: 10px;
        }

        .rectangle p,
        .rectangle input,
        .rectangle button {
            margin: 0;
            padding: 0;
        }

        h2 {
            color: blue;
            font-size: 26px;
            font-family: Tahoma;
            text-align: left;
        }

        h2 {
            color: blue;
            font: size 32px;
            font-style: tahoma;
        }
    </style>
</head>

<body>

    <div class="rectangle">
        <br>
        <h2>Login</h2>
        <label>Username</label> <br>
        <input type="text"> <br>
        <label>Password</label> <br>
        <input type="password">
        <button>Login</button>
    </div>

</body>

</html>
